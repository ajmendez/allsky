<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title == site.title %}{{ site.title }}{% else %}{{ page.title }} — {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">

  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}">
</head>
<body>

<header>
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
  <nav>
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/privacy' | relative_url }}">Privacy Policy</a>
    <a href="{{ '/terms' | relative_url }}">Terms of Service</a>
  </nav>
</header>

<main>
  {{ content }}
</main>

<footer>
  <a href="{{ '/privacy' | relative_url }}">Privacy Policy</a>
  <a href="{{ '/terms' | relative_url }}">Terms of Service</a>
  <br>
  &copy; {{ site.copyright_year }} AllSky Camera Project
</footer>

</body>
</html>
